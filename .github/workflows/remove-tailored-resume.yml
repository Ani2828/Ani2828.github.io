name: Remove tailored resume from history

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove the PDF from all commits and refs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch -- Ananya_Kumari_AI_ML_Resume_Tailored.pdf' --prune-empty --tag-name-filter cat -- --all
          git push --force origin main
